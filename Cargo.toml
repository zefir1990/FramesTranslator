[package]
name = "frames_translator"
version = "0.1.0"
edition = "2024"

[lib]
name = "frames_translator"
path = "src/lib.rs"

[[bin]]
name = "FramesTranslator"
path = "src/main.rs"

[[bin]]
name = "NeuralNetworkFramesDetectorSourcerTestApplication"
path = "src/bin/neural_network_frames_detector_sourcer_test_application.rs"

[[bin]]
name = "ScreenshotTranslator"
path = "src/bin/screenshot_translator/main.rs"

[build-dependencies]
cc = "1"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
imgui = "0.12"
json5 = "1"
sdl3 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
