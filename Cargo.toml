[package]
name = "frames_translator"
version = "0.1.0"
edition = "2024"

[lib]
name = "frames_translator"
path = "src/lib.rs"

[[bin]]
name = "FramesTranslator"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
json5 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
